<button
  [type]="type()"
  [disabled]="disabled()"
  [class]="classes()"
  [class.w-full]="block()"
  class="inline-flex min-h-touch items-center justify-center gap-2 rounded-xl px-4 text-sm font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-40"
  (click)="onClick()"
>
  <ng-content />
</button>
